<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="0" y="0" width="640" height="280" fill="#fbfbf9"/>

  <!-- ESC side -->
  <text x="150" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">ESC lead (stock)</text>
  <line x1="40" y1="140" x2="150" y2="140" stroke="#c23b2c" stroke-width="6" stroke-linecap="round"/>
  <line x1="40" y1="156" x2="150" y2="156" stroke="#222222" stroke-width="6" stroke-linecap="round"/>
  <g>
    <rect x="150" y="118" width="90" height="56" rx="8" fill="#f2c14e" stroke="#8a6d1a" stroke-width="2"/>
    <circle cx="180" cy="136" r="7" fill="#b8860b"/>
    <circle cx="180" cy="156" r="7" fill="#b8860b"/>
    <text x="195" y="151" font-size="13" font-weight="700" fill="#5c4a0f">XT60</text>
  </g>

  <!-- mismatch symbol -->
  <g transform="translate(320,146)">
    <circle r="26" fill="#fbe4e0" stroke="#c23b2c" stroke-width="2.5"/>
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#c23b2c" stroke-width="5" stroke-linecap="round"/>
    <line x1="11" y1="-11" x2="-11" y2="11" stroke="#c23b2c" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="320" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#8a3b2e">Won't plug together</text>

  <!-- Battery side -->
  <text x="490" y="40" text-anchor="middle" font-size="14" font-weight="700" fill="#111111">Battery lead</text>
  <line x1="600" y1="140" x2="490" y2="140" stroke="#c23b2c" stroke-width="6" stroke-linecap="round"/>
  <line x1="600" y1="156" x2="490" y2="156" stroke="#222222" stroke-width="6" stroke-linecap="round"/>
  <g>
    <rect x="400" y="112" width="90" height="68" rx="10" fill="#dfe6ea" stroke="#5b6b75" stroke-width="2"/>
    <circle cx="435" cy="134" r="9" fill="#8a97a0"/>
    <circle cx="435" cy="158" r="9" fill="#8a97a0"/>
    <text x="450" y="151" font-size="13" font-weight="700" fill="#3c4a52">EC5</text>
  </g>

  <text x="320" y="250" text-anchor="middle" font-size="12.5" fill="#565f6b">The ESC ships with an XT60 plug. The Zeee battery ships with EC5. Different shapes — one has to change.</text>
  <text x="320" y="268" text-anchor="middle" font-size="11" fill="#9aa0a6">Reference diagram — not from the official CURV LAB guide</text>
</svg>
